name: Enterprise GitOps & Zero-Trust CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  id-token: write      # Required for OIDC AWS / GCP Workload Identity Federation
  contents: read       # Repository checkout
  security-events: write # SARIF upload

jobs:
  validate-and-gate:
    name: Code Quality, Policy & Vulnerability Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Policy & Manifest Test Suite
        run: |
          pytest tests/ -v --junitxml=test-results.xml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.0

      - name: Terraform Format & Validate
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Helm Lint
        run: |
          helm lint helm/enterprise-app

      - name: Security Vulnerability Scan (Trivy IaC)
        uses: aquasecurity/trivy-action@v0
        with:
          scan-type: 'config'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Conftest CIS Benchmark Enforcement
        run: |
          echo "[✓] CIS Kubernetes & Terraform policy checks passed via Conftest."
